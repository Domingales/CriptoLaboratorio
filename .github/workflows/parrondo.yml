name: Parrondo isolated research checks
on:
  push:
    branches:
      - research/parrondo-experiment
    paths:
      - 'research/parrondo.py'
      - 'research/parrondo_backtest.py'
      - 'research/parrondo_data.py'
      - 'research/native_reference.py'
      - 'tests/test_parrondo.py'
      - 'tests/test_parrondo_backtest.py'
      - 'tests/test_parrondo_data.py'
      - 'tests/test_native_dependency_retry.py'
      - '.github/workflows/parrondo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parrondo-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only needed dependencies
        run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Run independent integrity and retry tests
        run: python -m unittest discover -s tests -p 'test_parrondo.py' -v && python -m unittest discover -s tests -p 'test_parrondo_backtest.py' -v && python -m unittest discover -s tests -p 'test_parrondo_data.py' -v && python -m unittest discover -s tests -p 'test_native_dependency_retry.py' -v
      - name: Compile Parrondo module
        run: python -m py_compile research/parrondo.py research/parrondo_backtest.py research/native_reference.py
