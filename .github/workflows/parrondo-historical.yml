name: Parrondo historical evaluation
on:
  push:
    branches: [research/parrondo-experiment]
    paths:
      - '.github/workflows/parrondo-historical.yml'
      - 'research/parrondo_backtest.py'
      - 'research/parrondo_data.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parrondo-historical
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - uses: actions/cache@v4
        with:
          path: data/archives
          key: parrondo-hourly-2022-2026-v1
      - name: Verify integrity tests before historical run
        run: python -m unittest discover -s tests -p 'test_parrondo_backtest.py' -v && python -m unittest discover -s tests -p 'test_parrondo_data.py' -v
      - name: Download verified official hourly archives
        run: python -m research.parrondo_data --start 2022-01 --end 2026-09
      - name: Evaluate all 15 combinations without tuning
        run: python -m research.parrondo_backtest --cost-bps 20
      - name: Require all 30 period-combinations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/parrondo/results.json').read_text())
          missing=[(r['symbol'],r['timeframe'],r['period'],r.get('reason')) for r in x['results'] if r['status']!='COMPLETE']
          if len(x['results'])!=30 or missing:
              raise SystemExit(f'Incomplete Parrondo evaluation: {missing}')
          print('PASS: 15 combinations, 2 periods, no production integration')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parrondo-historical-${{ github.run_id }}
          path: |
            results/parrondo/
            data/parrondo-source-manifest.json
          retention-days: 30
          if-no-files-found: warn
